# Builds Keyhole for Windows (Setup exe) and Android (APK) and publishes both to
# a GitHub Release. Runs when a version tag (like v1.1.0) is pushed, or when you
# click "Run workflow" on the Actions tab (it then creates the tag v<Version>
# from game/game.go). Untick "publish" to only build and keep the files as
# workflow artifacts.
#
# The Ironite Launcher and the in-game updater install Keyhole-Setup-<version>.exe.
# The APK is signed with the key in the KEYHOLE_KEYSTORE_B64 secret so phones can
# install updates over earlier versions.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Test the rules
        shell: bash
        run: go test ./rules/

      - name: Build app and installer
        shell: bash
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Keyhole-Setup-*.exe
            dist/RELEASE_NOTES.md

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYHOLE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keyhole.jks"
            echo "KEYHOLE_KEYSTORE=$RUNNER_TEMP/keyhole.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets; using the key in android/keystore."
          fi

      - name: Build APK
        env:
          KEYHOLE_KEYSTORE_PASSWORD: ${{ secrets.KEYHOLE_KEYSTORE_PASSWORD }}
          KEYHOLE_KEY_ALIAS: ${{ secrets.KEYHOLE_KEY_ALIAS }}
          KEYHOLE_KEY_PASSWORD: ${{ secrets.KEYHOLE_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          ./build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/Keyhole-*.apk

  release:
    needs: [windows, android]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Read version
        id: ver
        run: echo "version=$(grep -oE 'Version = \"[0-9.]+\"' game/game.go | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Keyhole ${{ steps.ver.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/Keyhole-Setup-*.exe
            dist/Keyhole-*.apk
